name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Tests and Keyware.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Headless tests
        # No DISPLAY is set, so the window tests skip; the rest use fakes and never install a real hook.
        run: python -m pytest -q

      - name: Build Keyware.exe
        run: python build.py

      - name: Smoke-test the exe (no window, no hook)
        shell: pwsh
        run: |
          $v = Start-Process dist/Keyware.exe -ArgumentList '--version','--out','version.txt' -Wait -PassThru
          if ($v.ExitCode -ne 0) { throw "--version exited $($v.ExitCode)" }
          $want = python -c "from engine import __version__; print(__version__)"
          $got = (Get-Content version.txt -Raw).Trim()
          if ($got -ne $want) { throw "exe reports $got, source is $want" }
          $s = Start-Process dist/Keyware.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($s.ExitCode -ne 0) { throw "--self-test exited $($s.ExitCode)" }
          Write-Host "Keyware.exe $got: --version and --self-test passed"

      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash dist/Keyware.exe -Algorithm SHA256).Hash | Tee-Object dist/Keyware.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keyware-exe-unsigned
          path: |
            dist/Keyware.exe
            dist/Keyware.exe.sha256
          if-no-files-found: error

  site:
    name: Website tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm test
