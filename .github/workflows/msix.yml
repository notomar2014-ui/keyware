name: Microsoft Store MSIX

# Builds Keyware.msix on windows-latest (MakeAppx/MakePri ship with the runner's Windows SDK).
# Runs only on this branch or by hand, so the normal Keyware.exe workflow is untouched.
#   - Always: tests, a sideload TEST package (CN=KeywareTest, self-signed), install + smoke test
#     that the packaged exe sees package identity and the StartupTask backend, WACK report.
#   - When the three Partner Center inputs are given (Run workflow > fill them in): an UNSIGNED
#     Store package to upload to Partner Center (the Store signs it).
on:
  push:
    branches: [msix-store]
  workflow_dispatch:
    inputs:
      identity_name:
        description: "Package/Identity/Name from Partner Center > Product identity"
        required: false
      publisher:
        description: "Package/Identity/Publisher (starts with CN=)"
        required: false
      publisher_display_name:
        description: "Package/Properties/PublisherDisplayName"
        required: false
      display_name:
        description: "Reserved app name"
        required: false
        default: "Keyware"

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-store.txt

      - name: Install dependencies (Store extras included)
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-store.txt

      - name: Headless tests
        # No DISPLAY: window tests skip. Everything else uses fakes; no real hook, startup task or audio.
        run: python -m pytest -q

      - name: Build Keyware.exe (KEYWARE_MSIX=1)
        shell: pwsh
        run: |
          $env:KEYWARE_MSIX = "1"
          python build.py

      - name: Test package (self-signed, CN=KeywareTest)
        shell: pwsh
        run: |
          $pw = [guid]::NewGuid().ToString()
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=KeywareTest" -KeyUsage DigitalSignature `
            -FriendlyName "Keyware CI test" -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $secure = ConvertTo-SecureString $pw -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.pfx" -Password $secure | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.cer" | Out-Null
          ./store/build_msix.ps1 -Test -SkipExeBuild -PfxPath "$env:RUNNER_TEMP\test.pfx" -PfxPassword $secure
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/msix/Keyware.msix out/Keyware-test-sideload.msix
          Copy-Item "$env:RUNNER_TEMP\test.cer" out/Keyware-test-sideload.cer

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: Keyware-msix-test-sideload
          path: out/
          if-no-files-found: error

      - name: Install and smoke test (package identity + StartupTask backend)
        shell: pwsh
        run: |
          Import-Certificate -FilePath out/Keyware-test-sideload.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path out/Keyware-test-sideload.msix
          $pkg = Get-AppxPackage -Name "KeywareTest.Keyware"
          if (-not $pkg) { throw "package did not install" }
          $status = Join-Path $env:RUNNER_TEMP "status.json"
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\keyware.exe"
          Start-Process -FilePath $alias -ArgumentList @("--startup-status", "`"$status`"") -Wait -NoNewWindow
          $report = Get-Content $status -Raw | ConvertFrom-Json
          $report | Format-List | Out-Host
          if (-not $report.packaged) { throw "the packaged exe did not detect package identity" }
          if ($report.backend -ne "StartupTaskRegistry") { throw "expected the StartupTask backend, got $($report.backend)" }
          $run = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name Keyware -ErrorAction SilentlyContinue
          if ($run) { throw "the packaged build must not write HKCU Run" }
          Remove-AppxPackage -Package $pkg.PackageFullName

      - name: Windows App Certification Kit (report only)
        continue-on-error: true
        shell: pwsh
        run: |
          $appcert = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe" -ErrorAction SilentlyContinue
          if (-not $appcert) { Write-Warning "WACK not on this runner image; skipped."; exit 0 }
          & $appcert.FullName reset
          & $appcert.FullName test -appxpackagepath (Resolve-Path out/Keyware-test-sideload.msix) -reportoutputpath "$PWD\out\wack.xml"
          if (Test-Path out\wack.xml) { Select-String -Path out\wack.xml -Pattern 'OVERALL_RESULT="[A-Z]+"' | % { $_.Matches.Value } }

      - name: Upload WACK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keyware-wack-report
          path: out/wack.xml
          if-no-files-found: ignore

      - name: Store package (unsigned, for Partner Center upload)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_name != '' && inputs.publisher != '' && inputs.publisher_display_name != '' }}
        shell: pwsh
        env:
          ID_NAME: ${{ inputs.identity_name }}
          ID_PUBLISHER: ${{ inputs.publisher }}
          ID_PUBLISHER_DISPLAY: ${{ inputs.publisher_display_name }}
          ID_DISPLAY: ${{ inputs.display_name }}
        run: |
          ./store/build_msix.ps1 -SkipExeBuild -IdentityName $env:ID_NAME -Publisher $env:ID_PUBLISHER `
            -PublisherDisplayName $env:ID_PUBLISHER_DISPLAY -DisplayName $env:ID_DISPLAY
          New-Item -ItemType Directory -Force store-out | Out-Null
          Copy-Item dist/msix/Keyware.msix, dist/msix/Keyware.msix.sha256 store-out/

      - name: Upload Store package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_name != '' && inputs.publisher != '' && inputs.publisher_display_name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Keyware-msix-store-upload
          path: store-out/
          if-no-files-found: error
